[package]
name = "gamelink-sdk"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "GameLink room, signaling, and peer-to-peer game networking SDK"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
urlencoding = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
webrtc = "0.12"
