[package]
name = "gamelink-server"
version = "1.3.0"
edition = "2024"

[dependencies]
axum = "0.8"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "process", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

mongodb = "3.3"
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
